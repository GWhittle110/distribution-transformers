name: logistic_regression
module_path: "static.logistic_regression"

n_components: 4

meta_prior_kwargs:
  scale_eps: 0.00001
  scale_parametrisation: scale_tril
  default_scale_multiple: 1.

observation_model_kwargs:
  obs_1:
    n_features: 24
    n_datapoints: 1000

component_embedding_kwargs:
  hidden_layer_sizes: [32]
  activation: gelu
  jitter: 0.00001
  eps: 0.000001
  scale_parametrisation: scale_tril

observation_embedding_kwargs:
  obs_1:
    hidden_layer_sizes: [32]
    activation: gelu

transformer_kwargs:
  d_model: 32
  n_head: 8
  dim_feedforward: 2048
  dropout: 0
  num_layers: 6
  activation: gelu

training_kwargs:
  warmup_epochs: 5
  epochs: 30
  steps_per_epoch: 100
  batch_size: 100
  lr: 0.001
  weight_decay: 0
  verbose: True
  progress_bar: True
  save_interval: -1
  save_loss_series: False

testing_kwargs:

name: lti_filter
module_path: "dynamic.lti_filter"

n_components: 4
state_size: 1

meta_prior_kwargs:
  scale_parametrisation: covariance_matrix
  default_scale_multiple: 50

observation_covariance_matrix:
  obs_1: [[1.]]
  obs_2: [[4.]]

component_embedding_kwargs:
  hidden_layer_sizes: [32]
  activation: gelu
  jitter: 0.000001
  eps: 0.000001
  scale_parametrisation: covariance_matrix

observation_embedding_kwargs:
  obs_1:
    hidden_layer_sizes: [32]
    activation: gelu
  obs_2:
    hidden_layer_sizes: [ 32 ]
    activation: gelu

transformer_kwargs:
  d_model: 32
  n_head: 8
  dim_feedforward: 2048
  dropout: 0
  num_layers: 6
  activation: gelu

motion_model_kwargs:
  state_transition_matrix: [[.95]]
  process_noise_scale_cholesky: [[1.]]
  x0_loc: [0.]
  x0_covariance_matrix: [[1.]]

training_kwargs:
  warmup_epochs: 5
  epochs: 20
  steps_per_epoch: 100
  batch_size: 5000
  lr: 0.001
  weight_decay: 0
  verbose: True
  progress_bar: True
  save_interval: -1
  save_loss_series: False

testing_kwargs:
  series_length: 100
  n_test_series: 1000
  plotting_kwargs:
    dim: 0
  competitor_kwargs:
    ekf

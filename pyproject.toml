[build-system]
requires = ["setuptools", "setuptools-scm"]
build-backend = "setuptools.build_meta"


[project]
name = "distribution_transformers"
authors = [
    {name = "George Whittle", email = "george.whittle@reuben.ox.ac.uk"}
]
version = "0.0.0"
dependencies = [
    "torch>=2.5.0",
    "tqdm",
    "scikit-learn",
    "threadpoolctl>=3.0.0",
    "matplotlib",
    "gpytorch"
]
requires-python = ">=3.12.0"


[project.optional-dependencies]
dev = [
    "pytest",
    "sacred",
    "pyyaml",
    "importlib"
]


[project.urls]
Homepage = "https://github.com/GWhittle110/distribution-transformers"


[tools.pytest.ini.options]
addopts = [
    "--import-mode=importlib"
]
pythonpath = "src"